<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigación Criminal - El Bar</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #08090c;
      color: #e1e4e8;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    #game-container {
      background-color: #12151e;
      border: 2px solid #23283b;
      border-radius: 10px;
      max-width: 750px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
    }

    /* Ventana visual 2D */
    #scene-view {
      height: 220px;
      background: linear-gradient(180deg, #0f111a 0%, #1a1e2e 100%);
      border-bottom: 2px solid #23283b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      position: relative;
    }

    #location-tag {
      align-self: flex-start;
      background-color: #d93838;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 4px 10px;
      border-radius: 4px;
    }

    #visual-element {
      font-size: 4.5rem;
      text-shadow: 0 0 20px rgba(217, 56, 56, 0.4);
      margin-bottom: 15px;
      user-select: none;
    }

    /* Interfaz de diálogo */
    #ui-container {
      padding: 25px;
    }

    #character-name {
      color: #58a6ff;
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #story-text {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 25px;
      min-height: 65px;
    }

    /* Botones de decisión */
    .choice-btn {
      display: block;
      width: 100%;
      background-color: #1b2030;
      color: #3fb950;
      border: 1px solid #30363d;
      padding: 14px 18px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .choice-btn:hover {
      background-color: #23293d;
      border-color: #3fb950;
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Pantalla 2D -->
    <div id="scene-view">
      <div id="location-tag">Escena del Crimen</div>
      <div id="visual-element">🚨 🍸 🚪</div>
    </div>

    <!-- Panel de control e historia -->
    <div id="ui-container">
      <div id="character-name">Detective Carl</div>
      <div id="story-text">Cargando caso...</div>
      <div id="choices-container"></div>
    </div>
  </div>

  <script>
    // Lógica e historia del juego
    const historia = {
      inicio: {
        icono: "🚨 🍸 🚪",
        texto: "Llegas al Bar 'La Sombra'. Las luces de patrulla parpadean contra la lluvia fina de la medianoche. Hay una cinta de escena del crimen bloqueando la entrada principal. Dentro del bar hay un cadáver y varias evidencias intactas.",
        opciones: [
          { texto: "Entrar al bar para inspeccionar la escena", destino: "dentroBar" },
          { texto: "No entrar y revisar el exterior", destino: "fueraBar" }
        ]
      },
      dentroBar: {
        icono: "🔍 🍷 🩸",
        texto: "Levantas la cinta policial y empujas la puerta del bar. El olor a alcohol rancio y hierro llena el aire. La víctima yace sobre una mesa volcada, con un vaso roto a poca distancia y una nota ensangrentada en el piso.",
        opciones: [
          { texto: "Examinar la nota ensangrentada", destino: "examinarNota" },
          { texto: "Inspeccionar las marcas en la barra", destino: "barraBar" },
          { texto: "Volver afuera", destino: "inicio" }
        ]
      },
      fueraBar: {
        icono: "🌧️ 👟 🗑️",
        texto: "Decides mantener la distancia e ir al callejón lateral. Entre los contenedores de basura notas huellas de calzado fresco marcadas en el barro y una billetera tirada.",
        opciones: [
          { texto: "Recoger la billetera del barro", destino: "billetera" },
          { texto: "Seguir las huellas hacia la avenida", destino: "callejon" },
          { texto: "Regresar a la entrada del bar", destino: "inicio" }
        ]
      },
      examinarNota: {
        icono: "📄 🩸 🕵️‍♂️",
        texto: "La nota dice a medio escribir: 'Él sabe lo del dinero del...'. Alguien intentó destruir la prueba antes de huir.",
        opciones: [
          { texto: "Volver a tomar una decisión", destino: "inicio" }
        ]
      },
      barraBar: {
        icono: "🥃 🔍 💋",
        texto: "En la barra hay dos vasos. Uno está limpio, el otro conserva huellas marcadas y restos de labial rojo.",
        opciones: [
          { texto: "Volver a tomar una decisión", destino: "inicio" }
        ]
      },
      billetera: {
        icono: "💳 🆔 🕵️‍♂️",
        texto: "Abres la billetera. Pertenece a un hombre llamado Manuel R., pero dentro hay una tarjeta de presentación con el sello del bar.",
        opciones: [
          { texto: "Volver a tomar una decisión", destino: "inicio" }
        ]
      },
      callejon: {
        icono: "📻 🏃‍♂️ 🚗",
        texto: "Las huellas terminan bruscamente cerca de la calle principal. Todo indica que el sospechoso subió a un vehículo en marcha.",
        opciones: [
          { texto: "Volver a tomar una decisión", destino: "inicio" }
        ]
      }
    };

    function mostrarEscena(claveEscena) {
      const escena = historia[claveEscena];
      const textoElem = document.getElementById("story-text");
      const opcionesElem = document.getElementById("choices-container");
      const iconoElem = document.getElementById("visual-element");

      // Actualizar icono de la escena
      if (escena.icono) {
        iconoElem.innerText = escena.icono;
      }

      // Actualizar texto
      textoElem.innerText = escena.texto;

      // Limpiar botones anteriores
      opcionesElem.innerHTML = "";

      // Generar botones
      escena.opciones.forEach(opcion => {
        const boton = document.createElement("button");
        boton.innerText = `▶ ${opcion.texto}`;
        boton.className = "choice-btn";
        boton.onclick = () => mostrarEscena(opcion.destino);
        opcionesElem.appendChild(boton);
      });
    }

    // Iniciar juego al cargar la página
    document.addEventListener("DOMContentLoaded", () => {
      mostrarEscena("inicio");
    });
  </script>

</body>
</html>
