<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playoo 🎮 - Tu Universo 2D</title>
  <!-- Fuente caricaturesca/gamer desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', cursive, sans-serif;
      user-select: none;
    }

    body {
      background-color: #2f3542;
      background-image: radial-gradient(#3a4052 2px, transparent 2px);
      background-size: 24px 24px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PANTALLA INICIAL DE AUTENTICACIÓN */
    #authScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #2f3542;
      background-image: radial-gradient(#3a4052 2px, transparent 2px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .auth-brand {
      font-size: 56px;
      font-weight: 700;
      color: #ffa502;
      text-shadow: 4px 4px 0px #1e222d, -3px -3px 0px #1e222d, 3px -3px 0px #1e222d, -3px 3px 0px #1e222d;
      letter-spacing: 3px;
      transform: rotate(-3deg);
      margin-bottom: 25px;
    }

    .auth-card {
      background-color: #ffa502;
      border: 5px solid #2f3542;
      border-radius: 24px;
      padding: 30px;
      width: 360px;
      box-shadow: 0 10px 0px #1e222d;
    }

    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #eccc68;
      border: 3px solid #2f3542;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      color: #2f3542;
      transition: background 0.2s;
    }

    .tab-btn.active {
      background: #1e90ff;
      color: white;
      box-shadow: 0 4px 0px #1e222d;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-field {
      padding: 12px;
      border: 3px solid #2f3542;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 3px 0px rgba(0,0,0,0.1);
    }

    .btn {
      background-color: #2ed573;
      color: #ffffff;
      border: 3px solid #2f3542;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0px #1e222d;
      transition: all 0.1s ease;
    }

    .btn:hover {
      transform: translateY(-2deg);
      box-shadow: 0 7px 0px #1e222d;
    }

    .btn:active {
      transform: translateY(4deg);
      box-shadow: 0 1px 0px #1e222d;
    }

    .btn-danger {
      background-color: #ff4757;
    }

    .form-btn {
      width: 100%;
      margin-top: 10px;
    }

    /* MENSAJE DE ERROR O ALERTA */
    .error-msg {
      color: #ff4757;
      background-color: #2f3542;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      display: none;
    }

    #appContent {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background-color: #ff4757;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 5px solid #2f3542;
      box-shadow: 0 6px 0px #1e222d;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      color: #ffa502;
      text-shadow: 3px 3px 0px #2f3542, -2px -2px 0px #2f3542, 2px -2px 0px #2f3542, -2px 2px 0px #2f3542;
      letter-spacing: 2px;
      transform: rotate(-2deg);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-tag {
      background: #2f3542;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 18px;
      color: #ffa502;
      border: 2px solid #ffa502;
    }

    main {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .game-card-container {
      background: #70a1ff;
      border: 4px solid #2f3542;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 0px #1e222d;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #gameCanvas {
      background-color: #7bed9f;
      border: 4px solid #2f3542;
      border-radius: 14px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
    }

    .controls-hint {
      color: #eccc68;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 2px 2px 0px #2f3542;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- PANTALLA PRINCIPAL DE LOGIN Y REGISTRO -->
  <div id="authScreen">
    <div class="auth-brand">Playoo! 🎮</div>
    <div class="auth-card">
      <div class="tab-container">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Ingresar</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Registro</button>
      </div>

      <div id="authAlert" class="error-msg"></div>

      <!-- FORMULARIO DE LOGIN -->
      <form id="loginForm" class="form-group" onsubmit="handleAuth(event, 'login')">
        <input type="text" id="loginUser" class="input-field" placeholder="Usuario / Avatar" required>
        <input type="password" id="loginPass" class="input-field" placeholder="Contraseña" required>
        <button type="submit" class="btn form-btn">¡A Jugar!</button>
      </form>

      <!-- FORMULARIO DE REGISTRO -->
      <form id="registerForm" class="form-group" style="display: none;" onsubmit="handleAuth(event, 'register')">
        <input type="text" id="registerUser" class="input-field" placeholder="Nombre de Avatar" required>
        <input type="email" id="registerEmail" class="input-field" placeholder="Correo Electrónico" required>
        <input type="password" id="registerPass" class="input-field" placeholder="Crea una Contraseña" required>
        <button type="submit" class="btn form-btn" style="background-color: #1e90ff;">Crear Cuenta</button>
      </form>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div id="appContent">
    <header>
      <div class="logo">Playoo! 🎮</div>
      <div class="user-info">
        <span class="user-tag" id="displayUsername">👤 Avatar</span>
        <button class="btn btn-danger" onclick="logout()">Salir</button>
      </div>
    </header>

    <main>
      <div class="game-card-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
      </div>
      <p class="controls-hint">🎮 Usa WASD o las Flechas para mover tu avatar</p>
    </main>
  </div>

  <script>
    const authScreen = document.getElementById('authScreen');
    const appContent = document.getElementById('appContent');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const displayUsername = document.getElementById('displayUsername');
    const authAlert = document.getElementById('authAlert');

    let currentUser = null;

    // Obtener usuarios almacenados
    function getUsers() {
      return JSON.parse(localStorage.getItem('playoo_users') || '{}');
    }

    function saveUsers(users) {
      localStorage.setItem('playoo_users', JSON.stringify(users));
    }

    function showAlert(msg) {
      authAlert.textContent = msg;
      authAlert.style.display = 'block';
    }

    function hideAlert() {
      authAlert.style.display = 'none';
    }

    function switchTab(mode) {
      hideAlert();
      if (mode === 'login') {
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }

    function handleAuth(event, type) {
      event.preventDefault();
      hideAlert();

      const users = getUsers();

      if (type === 'register') {
        const username = document.getElementById('registerUser').value.trim();
        const password = document.getElementById('registerPass').value;

        // Comprobar si ya existe
        if (users[username.toLowerCase()]) {
          showAlert("⚠️ Esta cuenta ya está registrada. Por favor, inicia sesión.");
          switchTab('login');
          document.getElementById('loginUser').value = username;
          return;
        }

        // Guardar nuevo usuario
        users[username.toLowerCase()] = { username, password };
        saveUsers(users);

        currentUser = username;
        enterGame();

      } else if (type === 'login') {
        const usernameInput = document.getElementById('loginUser').value.trim();
        const passwordInput = document.getElementById('loginPass').value;

        const userAccount = users[usernameInput.toLowerCase()];

        if (!userAccount) {
          showAlert("❌ El usuario no existe. Regístrate primero.");
          return;
        }

        if (userAccount.password !== passwordInput) {
          showAlert("🔒 Contraseña incorrecta.");
          return;
        }

        currentUser = userAccount.username;
        enterGame();
      }
    }

    function enterGame() {
      displayUsername.textContent = `👤 ${currentUser}`;
      authScreen.style.display = 'none';
      appContent.style.display = 'flex';
      
      // Reiniciar posición del personaje
      player.x = 400;
      player.y = 225;
    }

    function logout() {
      currentUser = null;
      appContent.style.display = 'none';
      authScreen.style.display = 'flex';
      
      // Resetear campos y volver a pestaña Login
      document.getElementById('loginForm').reset();
      document.getElementById('registerForm').reset();
      switchTab('login');
    }

    // MOTOR DE JUEGO 2D EN CANVAS
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const player = {
      x: 400,
      y: 225,
      speed: 4
    };

    const keys = {};

    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    function update() {
      if (currentUser) {
        if (keys['arrowup'] || keys['w']) player.y -= player.speed;
        if (keys['arrowdown'] || keys['s']) player.y += player.speed;
        if (keys['arrowleft'] || keys['a']) player.x -= player.speed;
        if (keys['arrowright'] || keys['d']) player.x += player.speed;

        // Límites del canvas
        player.x = Math.max(25, Math.min(canvas.width - 25, player.x));
        player.y = Math.max(40, Math.min(canvas.height - 20, player.y));
      }
    }

    function drawHumanoidAvatar(x, y) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2f3542';
      ctx.fillStyle = '#ffffff';

      // 1. Piernas
      ctx.beginPath();
      ctx.lineCap = 'round';
      ctx.moveTo(x - 8, y + 15);
      ctx.lineTo(x - 10, y + 32);
      ctx.moveTo(x + 8, y + 15);
      ctx.lineTo(x + 10, y + 32);
      ctx.stroke();

      // 2. Brazos
      ctx.beginPath();
      ctx.moveTo(x - 12, y - 2);
      ctx.lineTo(x - 20, y + 12);
      ctx.moveTo(x + 12, y - 2);
      ctx.lineTo(x + 20, y + 12);
      ctx.stroke();

      // 3. Torso / Cuerpo Humano
      ctx.beginPath();
      ctx.roundRect(x - 12, y - 8, 24, 26, 8);
      ctx.fill();
      ctx.stroke();

      // 4. Cabeza
      ctx.beginPath();
      ctx.arc(x, y - 22, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 5. Ojos
      ctx.fillStyle = '#2f3542';
      ctx.beginPath();
      ctx.arc(x - 5, y - 24, 2.5, 0, Math.PI * 2);
      ctx.arc(x + 5, y - 24, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // 6. Sonrisa caricaturesca
      ctx.beginPath();
      ctx.arc(x, y - 21, 5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Cuadrícula de fondo
      ctx.strokeStyle = '#6ab04c';
      ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Dibujar Avatar Humanoide Blanco
      drawHumanoidAvatar(player.x, player.y);

      // Nombre del avatar flotando sobre la cabeza
      if (currentUser) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px Fredoka';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#2f3542';
        ctx.shadowBlur = 4;
        ctx.fillText(currentUser, player.x, player.y - 42);
        ctx.shadowBlur = 0; // Limpiar sombra
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
