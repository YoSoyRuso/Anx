<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playoo 🎮 - Tu Universo 2D</title>
  <!-- Fuente caricaturesca/gamer desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', cursive, sans-serif;
      user-select: none;
    }

    body {
      background-color: #1e222d;
      background-image: radial-gradient(#2f3542 2px, transparent 2px);
      background-size: 24px 24px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PANTALLA INICIAL DE AUTENTICACIÓN */
    #authScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1e222d;
      background-image: radial-gradient(#2f3542 2px, transparent 2px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .auth-brand {
      font-size: 64px;
      font-weight: 700;
      color: #ffa502;
      text-shadow: 4px 4px 0px #000, -3px -3px 0px #000, 3px -3px 0px #000, -3px 3px 0px #000;
      letter-spacing: 3px;
      transform: rotate(-3deg);
      margin-bottom: 25px;
      animation: floatLogo 3s ease-in-out infinite alternate;
    }

    @keyframes floatLogo {
      0% { transform: rotate(-3deg) translateY(0px); }
      100% { transform: rotate(-1deg) translateY(-8px); }
    }

    .auth-card {
      background-color: #ffa502;
      border: 5px solid #2f3542;
      border-radius: 28px;
      padding: 32px;
      width: 380px;
      box-shadow: 0 12px 0px #00000040, 0 16px 0px #2f3542;
    }

    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #eccc68;
      padding: 5px;
      border-radius: 16px;
      border: 3px solid #2f3542;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      color: #2f3542;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #1e90ff;
      color: white;
      border: 3px solid #2f3542;
      box-shadow: 0 4px 0px #2f3542;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-field {
      padding: 14px;
      border: 3px solid #2f3542;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 3px 0px rgba(0,0,0,0.1);
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: #1e90ff;
    }

    .btn {
      background-color: #2ed573;
      color: #ffffff;
      border: 3px solid #2f3542;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 5px 0px #2f3542;
      transition: all 0.1s ease;
      text-shadow: 1px 1px 0px #000;
    }

    .btn:hover {
      transform: translateY(-2deg);
      box-shadow: 0 7px 0px #2f3542;
    }

    .btn:active {
      transform: translateY(4deg);
      box-shadow: 0 1px 0px #2f3542;
    }

    .btn-danger {
      background-color: #ff4757;
    }

    .form-btn {
      width: 100%;
      margin-top: 10px;
      font-size: 18px;
    }

    .error-msg {
      color: #ffffff;
      background-color: #ff4757;
      border: 3px solid #2f3542;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      display: none;
      margin-bottom: 12px;
      box-shadow: 0 4px 0px #2f3542;
    }

    #appContent {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background-color: #ff4757;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 5px solid #2f3542;
      box-shadow: 0 6px 0px #00000030;
    }

    .logo {
      font-size: 34px;
      font-weight: 700;
      color: #ffa502;
      text-shadow: 3px 3px 0px #2f3542, -2px -2px 0px #2f3542, 2px -2px 0px #2f3542, -2px 2px 0px #2f3542;
      letter-spacing: 2px;
      transform: rotate(-2deg);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-tag {
      background: #2f3542;
      padding: 8px 18px;
      border-radius: 14px;
      font-size: 18px;
      color: #ffa502;
      border: 3px solid #ffa502;
      box-shadow: 0 4px 0px rgba(0,0,0,0.2);
    }

    main {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .game-card-container {
      background: #2f3542;
      border: 5px solid #485460;
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 12px 0px #00000050;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #gameCanvas {
      background-color: #7bed9f;
      border: 4px solid #2f3542;
      border-radius: 16px;
      display: block;
    }

    .controls-hint {
      color: #ffa502;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 2px 2px 0px #000;
      background: #2f3542;
      padding: 8px 20px;
      border-radius: 12px;
      border: 2px solid #485460;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- PANTALLA PRINCIPAL DE LOGIN Y REGISTRO -->
  <div id="authScreen">
    <div class="auth-brand">Playoo! 🎮</div>
    <div class="auth-card">
      <div class="tab-container">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Ingresar</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Registro</button>
      </div>

      <div id="authAlert" class="error-msg"></div>

      <!-- FORMULARIO DE LOGIN -->
      <form id="loginForm" class="form-group" onsubmit="handleAuth(event, 'login')">
        <input type="text" id="loginUser" class="input-field" placeholder="Usuario / Avatar" required>
        <input type="password" id="loginPass" class="input-field" placeholder="Contraseña" required>
        <button type="submit" class="btn form-btn">¡A Jugar!</button>
      </form>

      <!-- FORMULARIO DE REGISTRO -->
      <form id="registerForm" class="form-group" style="display: none;" onsubmit="handleAuth(event, 'register')">
        <input type="text" id="registerUser" class="input-field" placeholder="Nombre de Avatar" required>
        <input type="email" id="registerEmail" class="input-field" placeholder="Correo Electrónico" required>
        <input type="password" id="registerPass" class="input-field" placeholder="Crea una Contraseña" required>
        <button type="submit" class="btn form-btn" style="background-color: #1e90ff;">Crear Cuenta</button>
      </form>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div id="appContent">
    <header>
      <div class="logo">Playoo! 🎮</div>
      <div class="user-info">
        <span class="user-tag" id="displayUsername">👤 Avatar</span>
        <button class="btn btn-danger" onclick="logout()">Salir</button>
      </div>
    </header>

    <main>
      <div class="game-card-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
      </div>
      <p class="controls-hint">🎮 Usa WASD o las Flechas para mover tu avatar</p>
    </main>
  </div>

  <script>
    const authScreen = document.getElementById('authScreen');
    const appContent = document.getElementById('appContent');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const displayUsername = document.getElementById('displayUsername');
    const authAlert = document.getElementById('authAlert');

    let currentUser = null;

    function getUsers() {
      return JSON.parse(localStorage.getItem('playoo_users') || '{}');
    }

    function saveUsers(users) {
      localStorage.setItem('playoo_users', JSON.stringify(users));
    }

    function showAlert(msg) {
      authAlert.textContent = msg;
      authAlert.style.display = 'block';
    }

    function hideAlert() {
      authAlert.style.display = 'none';
    }

    function switchTab(mode) {
      hideAlert();
      if (mode === 'login') {
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }

    function handleAuth(event, type) {
      event.preventDefault();
      hideAlert();

      const users = getUsers();

      if (type === 'register') {
        const username = document.getElementById('registerUser').value.trim();
        const password = document.getElementById('registerPass').value;

        if (users[username.toLowerCase()]) {
          showAlert("⚠️ Esta cuenta ya está registrada. Por favor, inicia sesión.");
          switchTab('login');
          document.getElementById('loginUser').value = username;
          return;
        }

        users[username.toLowerCase()] = { username, password };
        saveUsers(users);

        currentUser = username;
        enterGame();

      } else if (type === 'login') {
        const usernameInput = document.getElementById('loginUser').value.trim();
        const passwordInput = document.getElementById('loginPass').value;

        const userAccount = users[usernameInput.toLowerCase()];

        if (!userAccount) {
          showAlert("❌ El usuario no existe. Regístrate primero.");
          return;
        }

        if (userAccount.password !== passwordInput) {
          showAlert("🔒 Contraseña incorrecta.");
          return;
        }

        currentUser = userAccount.username;
        enterGame();
      }
    }

    function enterGame() {
      displayUsername.textContent = `👤 ${currentUser}`;
      authScreen.style.display = 'none';
      appContent.style.display = 'flex';
      
      player.x = 400;
      player.y = 225;
    }

    function logout() {
      currentUser = null;
      appContent.style.display = 'none';
      authScreen.style.display = 'flex';
      
      document.getElementById('loginForm').reset();
      document.getElementById('registerForm').reset();
      switchTab('login');
    }

    // MOTOR DE JUEGO Y ANIMACIÓN EN CANVAS
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const player = {
      x: 400,
      y: 225,
      speed: 3.5,
      isMoving: false,
      facing: 'down', // 'up', 'down', 'left', 'right'
      animTimer: 0
    };

    const keys = {};

    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    function update() {
      if (!currentUser) return;

      let dx = 0;
      let dy = 0;

      if (keys['arrowup'] || keys['w']) dy -= 1;
      if (keys['arrowdown'] || keys['s']) dy += 1;
      if (keys['arrowleft'] || keys['a']) dx -= 1;
      if (keys['arrowright'] || keys['d']) dx += 1;

      player.isMoving = (dx !== 0 || dy !== 0);

      if (player.isMoving) {
        // Normalizar movimiento diagonal
        if (dx !== 0 && dy !== 0) {
          dx *= 0.7071;
          dy *= 0.7071;
        }

        player.x += dx * player.speed;
        player.y += dy * player.speed;

        // Determinar dirección de mirada
        if (Math.abs(dx) > Math.abs(dy)) {
          player.facing = dx > 0 ? 'right' : 'left';
        } else {
          player.facing = dy > 0 ? 'down' : 'up';
        }

        // Incrementar reloj de animación
        player.animTimer += 0.2;
      } else {
        player.animTimer += 0.05; // Animación reposo (Idle)
      }

      // Limitar dentro del lienzo
      player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
      player.y = Math.max(45, Math.min(canvas.height - 25, player.y));
    }

    function drawHumanoidAvatar(x, y) {
      const walkCycle = Math.sin(player.animTimer * 2);
      const legOffset = player.isMoving ? walkCycle * 8 : 0;
      const armOffset = player.isMoving ? -walkCycle * 8 : 0;
      const bounce = player.isMoving ? Math.abs(Math.sin(player.animTimer * 2)) * 3 : Math.sin(player.animTimer) * 1.5;

      // 1. Sombra bajo los pies
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.beginPath();
      ctx.ellipse(x, y + 30, 16 - (bounce * 0.5), 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#2f3542';
      ctx.lineCap = 'round';

      // Posicionamiento dinámico del cuerpo con rebote
      const bodyY = y - bounce;

      // 2. Piernas
      ctx.fillStyle = '#ffffff';
      
      // Pierna Izquierda
      ctx.beginPath();
      ctx.moveTo(x - 6, bodyY + 12);
      ctx.lineTo(x - 8, bodyY + 28 + legOffset);
      ctx.stroke();

      // Pierna Derecha
      ctx.beginPath();
      ctx.moveTo(x + 6, bodyY + 12);
      ctx.lineTo(x + 8, bodyY + 28 - legOffset);
      ctx.stroke();

      // 3. Brazos (Si mira hacia arriba los dibuja detrás)
      if (player.facing !== 'up') {
        // Brazo Izquierdo
        ctx.beginPath();
        ctx.moveTo(x - 12, bodyY - 2);
        ctx.lineTo(x - 18, bodyY + 10 + armOffset);
        ctx.stroke();

        // Brazo Derecho
        ctx.beginPath();
        ctx.moveTo(x + 12, bodyY - 2);
        ctx.lineTo(x + 18, bodyY + 10 - armOffset);
        ctx.stroke();
      }

      // 4. Torso
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(x - 12, bodyY - 8, 24, 24, 8);
      ctx.fill();
      ctx.stroke();

      // Brazos si está mirando hacia arriba
      if (player.facing === 'up') {
        ctx.beginPath();
        ctx.moveTo(x - 12, bodyY - 2);
        ctx.lineTo(x - 18, bodyY + 10 + armOffset);
        ctx.moveTo(x + 12, bodyY - 2);
        ctx.lineTo(x + 18, bodyY + 10 - armOffset);
        ctx.stroke();
      }

      // 5. Cabeza
      const headY = bodyY - 22;
      ctx.beginPath();
      ctx.arc(x, headY, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 6. Rostro (Ojos y Expresión según dirección)
      let eyeOffsetX = 0;
      let eyeOffsetY = 0;

      if (player.facing === 'left') eyeOffsetX = -5;
      if (player.facing === 'right') eyeOffsetX = 5;
      if (player.facing === 'up') eyeOffsetY = -4;
      if (player.facing === 'down') eyeOffsetY = 1;

      // Dibujar ojos si no mira hacia arriba
      if (player.facing !== 'up') {
        ctx.fillStyle = '#2f3542';
        
        // Ojo Izquierdo
        ctx.beginPath();
        ctx.arc(x - 5 + eyeOffsetX, headY - 2 + eyeOffsetY, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Ojo Derecho
        ctx.beginPath();
        ctx.arc(x + 5 + eyeOffsetX, headY - 2 + eyeOffsetY, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Sonrisa
        ctx.beginPath();
        ctx.arc(x + eyeOffsetX, headY + 2 + eyeOffsetY, 4, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();
      }
    }

    function drawMap() {
      // Fondo estilo tablero / césped estilizado
      const tileSize = 50;
      for (let r = 0; r < canvas.height / tileSize; r++) {
        for (let c = 0; c < canvas.width / tileSize; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#7bed9f' : '#70a1ff' == '#7bed9f' ? '#7bed9f' : '#6ab04c';
          ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
        }
      }

      // Textura suave de la hierba
      ctx.fillStyle = '#58b13f';
      for (let x = 20; x < canvas.width; x += 60) {
        for (let y = 20; y < canvas.height; y += 60) {
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawMap();

      // Dibujar personaje con sus animaciones
      drawHumanoidAvatar(player.x, player.y);

      // Nombre del avatar flotando sobre la cabeza
      if (currentUser) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px Fredoka';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 5;
        ctx.fillText(currentUser, player.x, player.y - 48);
        ctx.shadowBlur = 0;
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
