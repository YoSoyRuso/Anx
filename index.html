<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Network | Play & Create</title>
  
  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0d12;
      --card-bg: rgba(18, 22, 31, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-cyan: #00f0ff;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --font-title: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo decorativo */
    .grid-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
    }

    .glow-orb {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      right: 15%;
      z-index: -1;
      pointer-events: none;
    }

    /* Header */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 5%;
    }

    .logo {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 2px;
    }

    .logo-icon {
      color: var(--accent-cyan);
      margin-right: 5px;
    }

    .nav-status {
      font-size: 0.75rem;
      font-family: var(--font-title);
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .status-text {
      color: var(--text-main);
    }

    /* Layout Hero */
    .hero-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      padding: 2rem 5%;
      max-width: 1200px;
      margin: 0 auto;
      flex: 1;
      align-items: center;
    }

    @media (min-width: 900px) {
      .hero-container {
        grid-template-columns: 1fr 420px;
      }
    }

    .hero-text h1 {
      font-family: var(--font-title);
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      line-height: 1.05;
      margin: 1rem 0;
      letter-spacing: -1px;
    }

    .highlight {
      color: transparent;
      -webkit-text-stroke: 1px var(--text-main);
    }

    .badge {
      font-family: var(--font-title);
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      letter-spacing: 1px;
      color: var(--accent-cyan);
    }

    .hero-text p {
      color: var(--text-muted);
      max-width: 480px;
      font-size: 1rem;
      line-height: 1.6;
    }

    /* Tarjeta de Login/Registro */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      padding: 2.5rem 2rem;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.8rem 0;
      font-family: var(--font-title);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .tab-btn.active {
      color: var(--text-main);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 1.2rem;
    }

    .auth-form.active {
      display: flex;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .input-group label {
      font-family: var(--font-title);
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .input-group input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      padding: 0.8rem 1rem;
      border-radius: 4px;
      color: var(--text-main);
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-group input:focus {
      border-color: var(--accent-cyan);
    }

    .btn-primary {
      margin-top: 1rem;
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      padding: 0.9rem;
      border-radius: 4px;
      font-family: var(--font-title);
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--accent-cyan);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Fondo dinámico sutil -->
  <div class="grid-background"></div>
  <div class="glow-orb"></div>

  <!-- Navegación -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">◈</span> AETHER
    </div>
    <div class="nav-status">
      <span class="status-dot"></span> SERVIDORES: <span class="status-text">ONLINE</span>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="hero-container">
    <section class="hero-text">
      <span class="badge">SISTEMA v0.1</span>
      <h1>JUEGA.<br><span class="highlight">CREA.</span> EVOLUCIONA.</h1>
      <p>La plataforma descentralizada para jugadores y desarrolladores. Accede a tu biblioteca o lanza tu propio universo.</p>
    </section>

    <!-- Caja de Autenticación -->
    <section class="auth-card">
      <div class="auth-tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Ingresar</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Registrarse</button>
      </div>

      <!-- Formulario Login -->
      <form id="form-login" class="auth-form active">
        <div class="input-group">
          <label for="login-email">USUARIO O EMAIL</label>
          <input type="text" id="login-email" placeholder="dev_player" required autocomplete="off">
        </div>
        <div class="input-group">
          <label for="login-pass">CONTRASEÑA</label>
          <input type="password" id="login-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
      </form>

      <!-- Formulario Registro -->
      <form id="form-register" class="auth-form">
        <div class="input-group">
          <label for="reg-user">NOMBRE DE USUARIO</label>
          <input type="text" id="reg-user" placeholder="ej. CyberDev" required autocomplete="off">
        </div>
        <div class="input-group">
          <label for="reg-email">CORREO ELECTRÓNICO</label>
          <input type="email" id="reg-email" placeholder="usuario@aether.com" required autocomplete="off">
        </div>
        <div class="input-group">
          <label for="reg-pass">CONTRASEÑA</label>
          <input type="password" id="reg-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">CREAR CUENTA</button>
      </form>
    </section>
  </main>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');
      const loginTab = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');

      if (tab === 'login') {
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
      } else {
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
      }
    }

    // Prevenir recarga de página al enviar datos (Demo)
    document.querySelectorAll('.auth-form').forEach(form => {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Conexión con el servidor enviada. (Etapa de pruebas)');
      });
    });
  </script>
</body>
</html>
