<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playoo 🎮 - Tu Universo 2D</title>
  <!-- Fuente caricaturesca/gamer desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', cursive, sans-serif;
      user-select: none;
    }

    body {
      background-color: #2f3542;
      background-image: radial-gradient(#3a4052 2px, transparent 2px);
      background-size: 24px 24px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* BARRA DE NAVEGACIÓN ESTILO CARTOON */
    header {
      width: 100%;
      background-color: #ff4757;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 5px solid #2f3542;
      box-shadow: 0 6px 0px #1e222d;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      color: #ffa502;
      text-shadow: 3px 3px 0px #2f3542, -2px -2px 0px #2f3542, 2px -2px 0px #2f3542, -2px 2px 0px #2f3542;
      letter-spacing: 2px;
      transform: rotate(-2deg);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* BOTONES CARICATURAS (Efecto Click 3D) */
    .btn {
      background-color: #2ed573;
      color: #ffffff;
      border: 3px solid #2f3542;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0px #1e222d;
      transition: all 0.1s ease;
    }

    .btn:hover {
      transform: translateY(-2deg);
      box-shadow: 0 7px 0px #1e222d;
    }

    .btn:active {
      transform: translateY(4deg);
      box-shadow: 0 1px 0px #1e222d;
    }

    .btn-secondary {
      background-color: #1e90ff;
    }

    .btn-danger {
      background-color: #ff4757;
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .game-card-container {
      background: #70a1ff;
      border: 4px solid #2f3542;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 0px #1e222d;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #gameCanvas {
      background-color: #7bed9f;
      border: 4px solid #2f3542;
      border-radius: 14px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
    }

    .controls-hint {
      color: #eccc68;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 2px 2px 0px #2f3542;
      margin-top: 10px;
    }

    /* MODAL DE LOGIN / REGISTRO */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-box {
      background-color: #ffa502;
      border: 5px solid #2f3542;
      border-radius: 24px;
      padding: 30px;
      width: 340px;
      box-shadow: 0 10px 0px #1e222d;
      position: relative;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); }
      100% { transform: scale(1); }
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: #ff4757;
      color: white;
      border: 3px solid #2f3542;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0px #1e222d;
    }

    /* PESTAÑAS EN EL MODAL */
    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: #eccc68;
      border: 3px solid #2f3542;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      color: #2f3542;
    }

    .tab-btn.active {
      background: #1e90ff;
      color: white;
      box-shadow: 0 4px 0px #1e222d;
    }

    /* FORMULARIOS */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-field {
      padding: 12px;
      border: 3px solid #2f3542;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 3px 0px rgba(0,0,0,0.1);
    }

    .form-btn {
      width: 100%;
      margin-top: 10px;
      background-color: #2ed573;
    }

    .user-tag {
      background: #2f3542;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 18px;
      color: #ffa502;
      border: 2px solid #ffa502;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO / NAVBAR -->
  <header>
    <div class="logo">Playoo! 🎮</div>
    <div class="user-info" id="authSection">
      <button class="btn btn-secondary" onclick="openAuthModal('login')">Ingresar</button>
      <button class="btn" onclick="openAuthModal('register')">Registrarse</button>
    </div>
  </header>

  <!-- CONTENIDO Y CANVAS -->
  <main>
    <div class="game-card-container">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>
    <p class="controls-hint">🎮 Usa WASD o las Flechas para mover tu avatar</p>
  </main>

  <!-- VENTANA EMERGENTE (LOGIN Y REGISTRO) -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeAuthModal()">X</button>
      
      <div class="tab-container">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Ingresar</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Registro</button>
      </div>

      <!-- FORMULARIO DE LOGIN -->
      <form id="loginForm" class="form-group" onsubmit="handleAuth(event, 'login')">
        <input type="text" id="loginUser" class="input-field" placeholder="Usuario / Avatar" required>
        <input type="password" class="input-field" placeholder="Contraseña" required>
        <button type="submit" class="btn form-btn">¡A Jugar!</button>
      </form>

      <!-- FORMULARIO DE REGISTRO -->
      <form id="registerForm" class="form-group" style="display: none;" onsubmit="handleAuth(event, 'register')">
        <input type="text" id="registerUser" class="input-field" placeholder="Nombre de Avatar" required>
        <input type="email" class="input-field" placeholder="Correo Electrónico" required>
        <input type="password" class="input-field" placeholder="Crea una Contraseña" required>
        <button type="submit" class="btn form-btn" style="background-color: #1e90ff;">Crear Cuenta</button>
      </form>
    </div>
  </div>

  <script>
    // SISTEMA DE AUTENTICACIÓN Y MODAL
    const modal = document.getElementById('authModal');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const authSection = document.getElementById('authSection');

    let currentUser = null;

    function openAuthModal(mode) {
      modal.style.display = 'flex';
      switchTab(mode);
    }

    function closeAuthModal() {
      modal.style.display = 'none';
    }

    function switchTab(mode) {
      if (mode === 'login') {
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }

    function handleAuth(event, type) {
      event.preventDefault();
      const username = type === 'login' 
        ? document.getElementById('loginUser').value 
        : document.getElementById('registerUser').value;

      currentUser = username;
      updateUserNavbar();
      closeAuthModal();
    }

    function logout() {
      currentUser = null;
      authSection.innerHTML = `
        <button class="btn btn-secondary" onclick="openAuthModal('login')">Ingresar</button>
        <button class="btn" onclick="openAuthModal('register')">Registrarse</button>
      `;
    }

    function updateUserNavbar() {
      authSection.innerHTML = `
        <span class="user-tag">👤 ${currentUser}</span>
        <button class="btn btn-danger" onclick="logout()">Salir</button>
      `;
    }

    // MOTOR DE JUEGO 2D EN CANVAS
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const player = {
      x: 400,
      y: 225,
      radius: 20,
      color: '#ff4757',
      speed: 5
    };

    const keys = {};

    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    function update() {
      if (keys['arrowup'] || keys['w']) player.y -= player.speed;
      if (keys['arrowdown'] || keys['s']) player.y += player.speed;
      if (keys['arrowleft'] || keys['a']) player.x -= player.speed;
      if (keys['arrowright'] || keys['d']) player.x += player.speed;

      // Límites de la pantalla
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar Cuadrícula de fondo
      ctx.strokeStyle = '#6ab04c';
      ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Dibujar Avatar Caricaturesco
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2f3542';
      ctx.stroke();

      // Ojos del personaje
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(player.x - 6, player.y - 4, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.x + 6, player.y - 4, 5, 0, Math.PI * 2); ctx.fill();

      // Pupilas
      ctx.fillStyle = '#2f3542';
      ctx.beginPath(); ctx.arc(player.x - 5, player.y - 4, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.x + 7, player.y - 4, 2, 0, Math.PI * 2); ctx.fill();

      // Etiqueta con el nombre del jugador arriba del avatar
      if (currentUser) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px Fredoka';
        ctx.textAlign = 'center';
        ctx.fillText(currentUser, player.x, player.y - 28);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
