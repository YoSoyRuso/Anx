<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Network | ¡Juega y Crea!</title>
  
  <!-- Tipografías amigables y redondeadas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f0fdf4;
      --card-bg: #ffffff;
      --border-color: #2b2d42;
      --accent-yellow: #ffde59;
      --accent-orange: #ff914d;
      --accent-green: #7ed957;
      --accent-blue: #5271ff;
      --text-dark: #2b2d42;
      --text-muted: #6c757d;
      --font-title: 'Fredoka', cursive, sans-serif;
      --font-hand: 'Mali', cursive, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-main);
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-dark);
      font-family: var(--font-title);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Barra Superior */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 6%;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-shadow: 2px 2px 0px var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      background: var(--accent-yellow);
      border: 3px solid var(--border-color);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 1.2rem;
      transform: rotate(-5deg);
    }

    .status-pill {
      background: #ffffff;
      border: 3px solid var(--border-color);
      border-radius: 50px;
      padding: 6px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 3px 3px 0px var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: var(--accent-green);
      border: 2px solid var(--border-color);
      border-radius: 50%;
    }

    /* Contenedor Principal */
    .main-container {
      max-width: 1100px;
      margin: auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
      align-items: center;
    }

    @media (min-width: 850px) {
      .main-container {
        grid-template-columns: 1fr 420px;
      }
    }

    /* Seccion Izquierda */
    .hero-box {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .welcome-tag {
      align-self: flex-start;
      background: var(--accent-orange);
      color: white;
      border: 3px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1rem;
      transform: rotate(-2deg);
      box-shadow: 3px 3px 0px var(--border-color);
    }

    .hero-box h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.1;
      color: var(--text-dark);
    }

    .highlight-green {
      color: var(--accent-green);
      text-shadow: 2px 2px 0px var(--border-color);
    }

    .highlight-yellow {
      color: var(--accent-yellow);
      text-shadow: 2px 2px 0px var(--border-color);
    }

    .hero-box p {
      font-size: 1.2rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .floating-doodles {
      font-family: var(--font-hand);
      font-size: 1.1rem;
      color: var(--accent-blue);
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    /* Tarjeta Cartoon de Login/Registro */
    .auth-card {
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 8px 8px 0px var(--border-color);
      position: relative;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
      background: #f1f5f9;
      padding: 6px;
      border-radius: 16px;
      border: 3px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-yellow);
      color: var(--text-dark);
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-box label {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .input-box input {
      border: 3px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 14px;
      font-family: var(--font-title);
      font-size: 1rem;
      outline: none;
      background: #fafafa;
      transition: transform 0.1s ease;
    }

    .input-box input:focus {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 3px 3px 0px var(--border-color);
    }

    .btn-submit {
      margin-top: 0.5rem;
      background: var(--accent-green);
      color: var(--text-dark);
      border: 3px solid var(--border-color);
      padding: 14px;
      border-radius: 16px;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--border-color);
      transition: all 0.1s ease;
    }

    .btn-submit:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border-color);
      background: #8eff66;
    }

    .btn-submit:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Navegación -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-badge">🎮</span> AETHER
    </div>
    <div class="status-pill">
      <span class="dot"></span> ¡Servidores Listos!
    </div>
  </header>

  <!-- Contenido -->
  <main class="main-container">
    
    <!-- Texto Amigable -->
    <section class="hero-box">
      <div class="welcome-tag">¡Hola, creador! 👋</div>
      <h1>¡JUEGA,<br><span class="highlight-yellow">CREA Y</span> <span class="highlight-green">DIVIÉRTETE!</span></h1>
      <p>Un espacio donde puedes probar juegos hechos por la comunidad o subir tus propias creaciones en segundos. Sin complicaciones.</p>
      
      <div class="floating-doodles">
        <span>✨ 100% Gratis</span>
        <span>🚀 Hecho por personas como tú</span>
      </div>
    </section>

    <!-- Caja Login/Registro Cartoon -->
    <section class="auth-card">
      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="setTab('login')">Entrar 🔑</button>
        <button class="tab-btn" id="tab-register" onclick="setTab('register')">Unirme 🎨</button>
      </div>

      <!-- Form Login -->
      <form id="form-login" class="form-group" onsubmit="event.preventDefault(); alert('¡Bienvenido de vuelta!');">
        <div class="input-box">
          <label for="login-user">Tu Apodo o Email</label>
          <input type="text" id="login-user" placeholder="ej. GamerPro99" required autocomplete="off">
        </div>
        <div class="input-box">
          <label for="login-pass">Tu Contraseña Secretísima</label>
          <input type="password" id="login-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">¡A JUGAR!</button>
      </form>

      <!-- Form Registro -->
      <form id="form-register" class="form-group hidden" onsubmit="event.preventDefault(); alert('¡Cuenta creada con éxito!');">
        <div class="input-box">
          <label for="reg-user">Elige un Nombre Genial</label>
          <input type="text" id="reg-user" placeholder="ej. PixelArtisan" required autocomplete="off">
        </div>
        <div class="input-box">
          <label for="reg-email">Tu Correo Electrónico</label>
          <input type="email" id="reg-email" placeholder="hola@amigo.com" required autocomplete="off">
        </div>
        <div class="input-box">
          <label for="reg-pass">Crea una Contraseña</label>
          <input type="password" id="reg-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">¡CREAR MI CUENTA!</button>
      </form>
    </section>

  </main>

  <script>
    function setTab(type) {
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');
      const loginBtn = document.getElementById('tab-login');
      const registerBtn = document.getElementById('tab-register');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginBtn.classList.add('active');
        registerBtn.classList.remove('active');
      } else {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        registerBtn.classList.add('active');
        loginBtn.classList.remove('active');
      }
    }
  </script>
</body>
</html>
